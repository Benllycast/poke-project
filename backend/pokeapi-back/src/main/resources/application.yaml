spring:
  application:
    name: pokeapi-back
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:file:./data/pokedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
server:
  port: 8080
pokeapi:
  base-url: https://pokeapi.co/api/v2
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-1234567890}
  expiration-ms: 7200000
