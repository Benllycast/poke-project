spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
jwt:
  secret: test-secret-key-at-least-32-bytes-long-1234567890
  expiration-ms: 7200000
pokeapi:
  base-url: https://pokeapi.co/api/v2
app:
  seed:
    enabled: false
